# 镜像 tag 与 GitHub Actions 的 docker/metadata-action 产出保持一致：
# type=semver,pattern={{version}} 会去掉前导 v，git tag v0.1.0 推出来的镜像是 :0.1.0。
images:
  system:
    repository: ghcr.io/kaiwuzaidao/kaiwu-system-service
    tag: 0.1.0
    pullPolicy: IfNotPresent
  gateway:
    repository: ghcr.io/kaiwuzaidao/kaiwu-gateway-service
    tag: 0.1.0
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/kaiwuzaidao/kaiwu-system-web
    tag: 0.1.0
    pullPolicy: IfNotPresent

runtimeSecret:
  existingSecret: kaiwu-runtime

database:
  embedded: false
  host: mysql.example.internal
  port: 3306
  name: kaiwu_platform
  username: kaiwu

redis:
  embedded: false
  host: redis.example.internal
  port: 6379

system:
  # 当前制品目录使用 RWO PVC，默认保持单副本。接入共享对象存储后再扩容。
  replicaCount: 1
  # 本文件的 ingress 开着 TLS，刷新令牌 Cookie 必须带 Secure。
  # 若你把 TLS 终结放在集群外的 LB 上、Ingress 这里是纯 HTTP，仍应保持 true。
  refreshCookieSecure: true
  artifactPersistence:
    enabled: true
    storageClass: standard
    size: 20Gi

gateway:
  replicaCount: 2

web:
  replicaCount: 2

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: kaiwu.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kaiwu-tls
      hosts:
        - kaiwu.example.com
