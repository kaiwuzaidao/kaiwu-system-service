apiVersion: v1
kind: Service
metadata:
  name: {{ include "kaiwu.fullname" . }}-gateway
  labels:
    {{- include "kaiwu.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector:
    {{- include "kaiwu.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8088
      targetPort: http
