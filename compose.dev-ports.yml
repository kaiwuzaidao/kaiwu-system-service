# 只在 `./scripts/kaiwu.sh dev` 混合模式下叠加：把 MySQL/Redis 暴露到宿主机回环地址，
# 供本机原生进程连接。
#
# 默认的 `up` 不加载本文件——基础设施只在 compose 网络内可见是更好的默认值，
# 没有理由让每台开发机都在 3306 上开一个可连的数据库。
#
# 一律绑定 127.0.0.1，不绑 0.0.0.0：同一咖啡馆网络里的其他人不该能连上你的开发库。
services:
  mysql:
    ports:
      - "127.0.0.1:${KAIWU_DEV_MYSQL_PORT:-3306}:3306"

  redis:
    ports:
      - "127.0.0.1:${KAIWU_DEV_REDIS_PORT:-6379}:6379"
