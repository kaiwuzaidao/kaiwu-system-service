name: Release image

# 打 v* 标签时构建并推送到 GHCR。手动触发用于补发。
#
# 本仓的 Dockerfile 要求构建上下文里同时有 kaiwu-system-starter 和
# kaiwu-system-service 两个目录（它先 install starter 再 package 本仓），
# 所以这里 checkout 两个仓到并排目录，context 设为仓库根。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kaiwu-system-service
      - uses: actions/checkout@v4
        with:
          repository: kaiwuzaidao/kaiwu-system-starter
          path: kaiwu-system-starter

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kaiwu-system-service
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          # 上下文是两个仓的父目录，Dockerfile 在其中一个仓里。
          context: .
          file: kaiwu-system-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
