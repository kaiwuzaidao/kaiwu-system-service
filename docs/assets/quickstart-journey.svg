<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Kaiwu 首次使用旅程</title>
  <desc id="desc">从启动平台、创建项目、交付前后端仓库，到使用熟悉的开发工具继续演进。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#090f2b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1440" height="560" rx="28" fill="url(#background)"/>
  <circle cx="1320" cy="70" r="190" fill="#818cf8" opacity="0.12"/>
  <circle cx="95" cy="520" r="220" fill="#38bdf8" opacity="0.08"/>
  <path d="M980 0 C1100 130 1240 160 1440 155 L1440 0 Z" fill="#ffffff" opacity="0.035"/>

  <g transform="translate(72 60)">
    <rect width="48" height="48" rx="14" fill="#ffffff" opacity="0.16"/>
    <text x="24" y="32" fill="#ffffff" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">K</text>
    <text x="64" y="31" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700">Kaiwu</text>
  </g>

  <text x="72" y="164" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="46" font-weight="750">从平台起步，到独立业务仓库</text>
  <text x="72" y="205" fill="#c7d2fe" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21">先建立可靠的工程边界，再把长期开发权交还给团队</text>

  <path d="M245 337 H410 M575 337 H740 M905 337 H1070" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M398 329 L412 337 L398 345 M728 329 L742 337 L728 345 M1058 329 L1072 337 L1058 345" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(72 260)">
      <rect width="180" height="154" rx="20" fill="#ffffff"/>
      <rect x="18" y="18" width="42" height="30" rx="9" fill="#e0e7ff"/>
      <text x="39" y="39" text-anchor="middle" fill="#4338ca" font-size="14" font-weight="700">01</text>
      <text x="18" y="83" fill="#111827" font-size="22" font-weight="700">启动平台</text>
      <text x="18" y="113" fill="#64748b" font-size="15">一次命令拉起</text>
      <text x="18" y="135" fill="#64748b" font-size="15">完整控制面</text>
    </g>

    <g transform="translate(402 260)">
      <rect width="180" height="154" rx="20" fill="#ffffff"/>
      <rect x="18" y="18" width="42" height="30" rx="9" fill="#dbeafe"/>
      <text x="39" y="39" text-anchor="middle" fill="#1d4ed8" font-size="14" font-weight="700">02</text>
      <text x="18" y="83" fill="#111827" font-size="22" font-weight="700">创建项目</text>
      <text x="18" y="113" fill="#64748b" font-size="15">AI 蓝图可选</text>
      <text x="18" y="135" fill="#64748b" font-size="15">工程基线一致</text>
    </g>

    <g transform="translate(732 260)">
      <rect width="180" height="154" rx="20" fill="#ffffff"/>
      <rect x="18" y="18" width="42" height="30" rx="9" fill="#fef3c7"/>
      <text x="39" y="39" text-anchor="middle" fill="#b45309" font-size="14" font-weight="700">03</text>
      <text x="18" y="83" fill="#111827" font-size="22" font-weight="700">交付双仓</text>
      <text x="18" y="113" fill="#64748b" font-size="15">前后端独立</text>
      <text x="18" y="135" fill="#64748b" font-size="15">平台不再回写</text>
    </g>

    <g transform="translate(1062 260)">
      <rect width="306" height="154" rx="20" fill="#ffffff"/>
      <rect x="18" y="18" width="42" height="30" rx="9" fill="#dcfce7"/>
      <text x="39" y="39" text-anchor="middle" fill="#15803d" font-size="14" font-weight="700">04</text>
      <text x="18" y="83" fill="#111827" font-size="22" font-weight="700">接续 AI Coding</text>
      <text x="18" y="113" fill="#64748b" font-size="15">使用团队熟悉的工具</text>
      <text x="18" y="135" fill="#64748b" font-size="15">独立发布、扩容与回滚</text>
    </g>
  </g>

  <g transform="translate(72 472)" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600">
    <rect width="116" height="36" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="58" y="24" text-anchor="middle" fill="#e0e7ff">AI 不是前置</text>
    <rect x="130" width="132" height="36" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="196" y="24" text-anchor="middle" fill="#e0e7ff">业务代码归团队</text>
    <rect x="276" width="132" height="36" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="342" y="24" text-anchor="middle" fill="#e0e7ff">每项目独立部署</text>
  </g>
</svg>
